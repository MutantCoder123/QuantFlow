<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0D111A">
    <title>QuantFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400&family=Doto:wght@900&display=swap">
    <!-- The design system, then each part of the app (static/<part>/, ES modules, no build step) -->
    <link rel="stylesheet" href="/static/shared/tokens.css">
    <link rel="stylesheet" href="/static/shared/base.css">
    <link rel="stylesheet" href="/static/market/market.css">
    <link rel="stylesheet" href="/static/signals/signals.css">
    <link rel="stylesheet" href="/static/discovery/discovery.css">
    <link rel="stylesheet" href="/static/performance/performance.css">
    <link rel="stylesheet" href="/static/review/review.css">
    <link rel="stylesheet" href="/static/inspector/inspector.css">
    <link rel="stylesheet" href="/static/settings/settings.css">
</head>

<body class="qf-app">
    <!-- static/shell/main.js renders the bar, the stale-price line and the phone tab bar,
         routes between the tabs, and mounts each tab's module into its section. -->
    <header id="app-bar" class="qf-bar"></header>
    <div id="feed-banner" class="qf-feed-banner" role="alert" hidden></div>
    <main id="main" class="qf-main">
        <section id="tab-market" class="hidden" aria-label="Market"></section>
        <section id="tab-signals" class="hidden" aria-label="Signals"></section>
        <section id="tab-discovery" class="hidden" aria-label="Discovery"></section>
        <section id="tab-performance" class="hidden" aria-label="Performance"></section>
        <section id="tab-review" class="hidden" aria-label="Review"></section>
    </main>
    <!-- Overlays open over the current tab (#inspect/SAIL, #settings/news) -->
    <div id="overlay-inspect"></div>
    <div id="overlay-settings"></div>
    <nav id="bottom-bar" class="qf-bottom" aria-label="Main"></nav>
    <noscript><p style="padding:24px">QuantFlow needs JavaScript.</p></noscript>
    <script type="module" src="/static/shell/main.js"></script>
    <script type="module" src="/static/performance/main.js"></script>
</body>

</html>
