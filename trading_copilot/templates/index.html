<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantFlow</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Outfit & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&family=Doto:wght@900&display=swap"
        rel="stylesheet">
    <!-- The app shell and the shared design system (static/shared, static/shell) -->
    <link rel="stylesheet" href="/static/shared/tokens.css">
    <link rel="stylesheet" href="/static/shared/base.css">
    <link rel="stylesheet" href="/static/inspector/inspector.css">
    <link rel="stylesheet" href="/static/market/market.css">
    <link rel="stylesheet" href="/static/signals/signals.css">
    <link rel="stylesheet" href="/static/discovery/discovery.css">
    <link rel="stylesheet" href="/static/review/review.css">
    <!-- Performance tab (static/performance/, ES modules, no build step) -->
    <link rel="stylesheet" href="/static/performance/performance.css">
    <style>
        /* The tabs not yet rebuilt keep their old Tailwind markup inside the new shell. */
        .qf-legacy {
            max-width: 90rem;
            margin: 0 auto;
            padding: 24px var(--gutter) 48px;
            font-family: 'Outfit', sans-serif;
        }

        .font-mono-custom {
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>

<body class="qf-app">
    <!-- The shell (static/shell/main.js) renders the bar, the banner and the phone tab bar. -->
    <header id="app-bar" class="qf-bar"></header>
    <div id="feed-banner" class="qf-feed-banner" role="alert" hidden></div>
    <!-- Main Container -->
    <main id="main" class="qf-main">

        <!-- DASHBOARD TAB -->
        <!-- MARKET TAB: rendered by /static/market/index.js, which prepends its page here.
             Below it, until the Settings sheet ships, the old prompt, watchlist and news controls. -->
        <section id="tab-market" aria-label="Market">
            <div class="qf-legacy space-y-4" id="market-legacy">
                <div class="flex items-center gap-4">
                        <button id="btn-settings"
                            class="bg-slate-700 hover:bg-slate-600 text-white text-[10px] uppercase font-bold py-1 px-3 rounded shadow transition-colors border border-slate-500/30">⚙️
                            Prompt Settings</button>
                        <button id="btn-edit-watchlist" onclick="openWatchlistModal()"
                            class="bg-emerald-600 hover:bg-emerald-500 text-white text-[10px] uppercase font-bold py-1 px-3 rounded shadow transition-colors border border-emerald-400/30">📋
                            Edit Watchlist</button>
                </div>
            <!-- Section: News Engine Control Panel -->
            <section class="bg-slate-900 border border-slate-700 rounded-lg p-4 shadow-lg mb-6">
                <h4 class="text-sm font-bold text-slate-300 mb-3 uppercase tracking-wider flex items-center gap-2">
                    <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9.5a2.5 2.5 0 00-2.5-2.5H15">
                        </path>
                    </svg>
                    Live News Engine
                </h4>

                <div class="flex flex-wrap items-center gap-4">
                    <button id="btn-news-instant" onclick="triggerNewsInstant()"
                        class="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded shadow-lg transition-colors flex items-center gap-2">
                        ⚡ Instant Fetch
                    </button>

                    <div class="flex items-center gap-2 border-l border-slate-700 pl-4">
                        <span class="text-xs text-slate-400 font-semibold uppercase">Model:</span>
                        <select id="news-model-select"
                            class="bg-slate-800 text-white text-xs border border-slate-600 rounded px-2 py-1 focus:outline-none focus:border-emerald-500">
                            <option value="ollama:qwen2.5:7b" selected>Local: qwen2.5:7b</option>
                            <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
                            <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
                        </select>
                    </div>

                    <div class="flex items-center gap-2 border-l border-slate-700 pl-4">
                        <label
                            class="text-xs text-slate-400 font-semibold uppercase flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" id="toggle-news-auto"
                                class="form-checkbox h-4 w-4 text-emerald-500 bg-slate-800 border-slate-600 rounded focus:ring-emerald-500 focus:ring-offset-slate-900"
                                onchange="toggleNewsAuto()">
                            Auto Fetch
                        </label>
                    </div>

                    <div class="flex items-center gap-2 border-l border-slate-700 pl-4">
                        <span class="text-xs text-slate-400 font-semibold uppercase">Interval (s):</span>
                        <input type="number" id="news-interval" value="120" min="30" step="30"
                            class="w-16 bg-slate-800 text-white text-xs border border-slate-600 rounded px-2 py-1 text-center focus:outline-none focus:border-emerald-500"
                            onchange="toggleNewsAuto()">
                    </div>

                    <div class="ml-auto flex items-center gap-2">
                        <span class="text-xs text-slate-400 font-semibold uppercase">Status:</span>
                        <span id="news-status-text" class="text-xs font-bold text-slate-500">Checking...</span>
                    </div>
                </div>
            </section>
            </div>
        </section>
        <!-- REVIEW TAB: rendered by /static/review/index.js -->
        <section id="tab-review" class="hidden" aria-label="Review"></section>
        <!-- SIGNALS TAB: rendered by /static/signals/index.js -->
        <section id="tab-signals" class="hidden" aria-label="Signals"></section>
        <!-- PERFORMANCE TAB: rendered by /static/performance/main.js -->
        <section id="tab-performance" class="hidden" aria-label="Performance"></section>
        <!-- DISCOVERY TAB: rendered by /static/discovery/index.js -->
        <section id="tab-discovery" class="hidden" aria-label="Discovery"></section>
    </main>
    <!-- The old settings controls' script -->
    <script>
        // The prompt, watchlist, news and data controls still on this page (until the Settings sheet).
        const apiBase = '';
    </script>
    <!-- Modals -->
    <div id="settings-modal"
        class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center">
        <div class="bg-slate-900 border border-slate-600 p-6 rounded-xl shadow-2xl w-full max-w-3xl flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-white flex items-center gap-2">⚙️ LLM Prompt Configuration</h2>
                <button id="btn-close-settings" class="text-slate-400 hover:text-white transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                        </path>
                    </svg>
                </button>
            </div>
            <p class="text-sm text-slate-400 mb-4">Configure the Master System Prompt that will be injected when copying
                telemetry JSON data.</p>
            <textarea id="prompt-editor"
                class="w-full h-64 bg-slate-950 border border-slate-700 text-emerald-400 p-4 font-mono-custom text-sm rounded focus:outline-none focus:border-indigo-500 shadow-inner"
                spellcheck="false"></textarea>

            <div class="mt-6 flex justify-between">
                <button id="btn-reset-settings"
                    class="bg-rose-900/50 hover:bg-rose-600 text-rose-300 hover:text-white font-bold py-2 px-6 rounded transition-colors border border-rose-700/50">Reset
                    to Default</button>
                <button id="btn-save-settings"
                    class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 px-6 rounded shadow-lg transition-colors shadow-emerald-500/20">Save
                    Configuration</button>
            </div>
        </div>
    </div>
    <!-- State Management Logic -->
    <script>
        // The master prompt lives in /static/shared/prompt.js (window.QF.prompt).
        const btnSettings = document.getElementById('btn-settings');
        const settingsModal = document.getElementById('settings-modal');
        const btnCloseSettings = document.getElementById('btn-close-settings');
        const promptEditor = document.getElementById('prompt-editor');
        const btnSaveSettings = document.getElementById('btn-save-settings');
        const btnResetSettings = document.getElementById('btn-reset-settings');
        // Open Modal
        btnSettings.addEventListener('click', () => {
            promptEditor.value = window.QF.prompt.loadPrompt();
            settingsModal.classList.remove('hidden');
        });
        // Close Modal
        btnCloseSettings.addEventListener('click', () => {
            settingsModal.classList.add('hidden');
        });
        // Save Configuration
        btnSaveSettings.addEventListener('click', () => {
            const newValue = promptEditor.value.trim();
            if (newValue) {
                window.QF.prompt.savePrompt(newValue);
                alert("Prompt Configuration Saved Successfully!");
                settingsModal.classList.add('hidden');
            } else {
                alert("Prompt cannot be empty!");
            }
        });
        // Reset Configuration
        btnResetSettings.addEventListener('click', () => {
            if (confirm("Are you sure you want to reset the prompt to its factory default?")) {
                promptEditor.value = window.QF.prompt.DEFAULT_PROMPT;
                window.QF.prompt.savePrompt(window.QF.prompt.DEFAULT_PROMPT);
                alert("Prompt Reset to Default!");
            }
        });
        // Map Option Tokens control removed (A-11): it proxied to a route
        // that only ever existed on the dead Angel One smart_api_feed.py and
        // always errored against the live upstox_feed.py on port 8001.

        // --- Phase 10: Watchlist Manager Logic ---
        const watchlistModal = document.getElementById('watchlist-modal');
        let currentWatchlist = [];
        async function openWatchlistModal() {
            document.getElementById('watchlist-modal').classList.remove('hidden');
            try {
                const res = await fetch(`${apiBase}/api/watchlist`);
                const data = await res.json();
                currentWatchlist = data.data || [];
                renderWatchlist();
            } catch (e) {
                console.error("Failed to fetch watchlist", e);
            }
        }
        function closeWatchlistModal() {
            document.getElementById('watchlist-modal').classList.add('hidden');
        }
        function renderWatchlist() {
            const list = document.getElementById('watchlist-items');
            list.innerHTML = '';
            currentWatchlist.forEach((item, idx) => {
                const li = document.createElement('li');
                li.className = "flex justify-between items-center bg-slate-800 p-2 rounded text-sm mb-1 border border-slate-700";
                li.innerHTML = `<span><span class="font-bold text-slate-200">${item.symbol}</span> <span class="text-xs text-slate-500 ml-1">(${item.exchange}:${item.token})</span></span>
                                <button onclick="removeWatchlistItem(${idx})" class="text-rose-400 hover:text-rose-300">🗑️</button>`;
                list.appendChild(li);
            });
        }
        function removeWatchlistItem(idx) {
            currentWatchlist.splice(idx, 1);
            renderWatchlist();
        }
        let activeWatchlistStream = null;
        async function saveWatchlist() {
            const btn = document.getElementById('btn-save-watchlist');
            btn.innerText = "Saving...";
            try {
                const res = await fetch(`${apiBase}/api/watchlist`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ items: currentWatchlist })
                });
                if (res.ok) {
                    alert("Watchlist updated successfully! Data stream reinitialized.");
                    closeWatchlistModal();
                } else {
                    alert("Failed to save watchlist.");
                }
            } catch (e) {
                alert("Error saving watchlist.");
            } finally {
                btn.innerText = "Save Changes";
            }
        }
        let searchTimeout;
        async function onWatchlistSearch() {
            const query = document.getElementById('watchlist-search').value;
            const resDiv = document.getElementById('watchlist-search-results');
            if (query.length < 2) { resDiv.innerHTML = ''; return; }

            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(async () => {
                try {
                    const res = await fetch(`${apiBase}/api/search-token?q=${query}`);
                    const data = await res.json();
                    resDiv.innerHTML = '';
                    (data.data || []).forEach(item => {
                        const div = document.createElement('div');
                        div.className = "p-2 hover:bg-slate-700 cursor-pointer text-sm flex justify-between border-b border-slate-700";
                        div.innerHTML = `<span><span class="font-bold text-slate-200">${item.symbol}</span></span> <span class="text-xs text-slate-400">${item.exchange}:${item.token}</span>`;
                        div.onclick = () => {
                            if (!currentWatchlist.find(x => x.token === item.token)) {
                                currentWatchlist.push(item);
                                renderWatchlist();
                            }
                            resDiv.innerHTML = '';
                            document.getElementById('watchlist-search').value = '';
                        };
                        resDiv.appendChild(div);
                    });
                } catch (e) {
                    console.error("Search failed", e);
                }
            }, 300);
        }
        // --- News Engine Controls ---
        let newsStateInterval = null;
        let newsRequestInFlight = false;
        function fetchNewsState() {
            if (newsRequestInFlight) return;
            fetch(`${apiBase}/api/news/state`)
                .then(r => r.json())
                .then(data => {
                    if (data.status === 'success') {
                        document.getElementById('toggle-news-auto').checked = data.is_active;
                        if (document.activeElement !== document.getElementById('news-interval')) {
                            document.getElementById('news-interval').value = data.interval;
                        }
                        if (document.activeElement !== document.getElementById('news-model-select')) {
                            document.getElementById('news-model-select').value = data.model;
                        }

                        const statusElem = document.getElementById('news-status-text');
                        if (data.is_active) {
                            const lastFetch = data.last_fetch_time > 0 ? new Date(data.last_fetch_time * 1000).toLocaleTimeString() : 'Never';
                            statusElem.innerHTML = `<span class="text-emerald-400">Running (Last: ${lastFetch})</span>`;
                        } else {
                            statusElem.innerHTML = `<span class="text-slate-500">Stopped</span>`;
                        }
                    }
                })
                .catch(err => console.error("Error fetching news state:", err));
        }
        function triggerNewsInstant() {
            const model = document.getElementById('news-model-select').value;
            const btn = document.getElementById('btn-news-instant');
            const origHtml = btn.innerHTML;
            btn.innerHTML = '⏳ Fetching...';
            btn.disabled = true;
            fetch(`${apiBase}/api/news/instant`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ model: model })
            })
                .then(r => r.json())
                .then(data => {
                    fetchNewsState();
                    setTimeout(() => { btn.innerHTML = origHtml; btn.disabled = false; }, 1000);
                })
                .catch(err => {
                    console.error(err);
                    btn.innerHTML = origHtml;
                    btn.disabled = false;
                });
        }
        function toggleNewsAuto() {
            const isChecked = document.getElementById('toggle-news-auto').checked;
            newsRequestInFlight = true;
            if (isChecked) {
                const model = document.getElementById('news-model-select').value;
                const interval = parseInt(document.getElementById('news-interval').value) || 120;
                fetch(`${apiBase}/api/news/loop/start`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ interval: interval, model: model })
                }).then(() => {
                    newsRequestInFlight = false;
                    fetchNewsState();
                }).catch(() => newsRequestInFlight = false);
            } else {
                fetch(`${apiBase}/api/news/loop/stop`, { method: 'POST' }).then(() => {
                    newsRequestInFlight = false;
                    fetchNewsState();
                }).catch(() => newsRequestInFlight = false);
            }
        }
        // --- Database Management Controls (Phase 14.3) ---
        function loadParquetSymbols() {
            fetch(`${apiBase}/api/watchlist`)
                .then(r => r.json())
                .then(data => {
                    const grid = document.getElementById('parquet-symbols-grid');
                    if (!grid) return;
                    const items = data.data || [];
                    if (items.length === 0) {
                        grid.innerHTML = '<span class="text-xs text-slate-500 italic">No symbols in watchlist.</span>';
                        return;
                    }
                    grid.innerHTML = '';
                    const uniqueSymbols = [...new Set(items.map(i => i.symbol.split('-')[0]))];
                    uniqueSymbols.forEach(sym => {
                        if (!sym || sym.toLowerCase() === 'nifty 50') return; // Skip invalid
                        const label = document.createElement('label');
                        label.className = "flex items-center gap-2 cursor-pointer p-1 hover:bg-slate-800 rounded transition-colors";
                        label.innerHTML = `
                            <input type="checkbox" value="${sym}" class="parquet-sym-checkbox w-3 h-3 bg-slate-900 border-slate-700 rounded text-orange-600 focus:ring-orange-500">
                            <span class="text-xs text-slate-300 font-mono-custom">${sym}</span>
                        `;
                        grid.appendChild(label);
                    });
                })
                .catch(err => console.error("Failed to load symbols for parquet:", err));
        }
        function selectAllParquetSymbols() {
            const checkboxes = document.querySelectorAll('.parquet-sym-checkbox');
            const allChecked = Array.from(checkboxes).every(cb => cb.checked);
            checkboxes.forEach(cb => cb.checked = !allChecked);
        }
        function syncEODParquet() {
            const checkboxes = document.querySelectorAll('.parquet-sym-checkbox:checked');
            const symbols = Array.from(checkboxes).map(cb => cb.value);

            const btn = document.getElementById('btn-sync-parquet');
            const status = document.getElementById('parquet-sync-status');

            if (symbols.length === 0) {
                status.innerHTML = `<span class="text-rose-400">Select at least one symbol.</span>`;
                status.classList.remove('hidden');
                setTimeout(() => status.classList.add('hidden'), 3000);
                return;
            }
            btn.disabled = true;
            btn.innerHTML = '⏳ Syncing...';
            status.innerHTML = `<span class="text-orange-400">Syncing Database...</span>`;
            status.classList.remove('hidden');
            fetch(`${apiBase}/api/admin/sync-parquet`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ symbols: symbols })
            })
                .then(r => r.json())
                .then(data => {
                    btn.innerHTML = '💾 Force Sync EOD Parquet';
                    btn.disabled = false;
                    status.innerHTML = `<span class="text-emerald-400">Sync Complete. Check terminal logs.</span>`;
                    setTimeout(() => status.classList.add('hidden'), 5000);
                })
                .catch(err => {
                    console.error(err);
                    btn.innerHTML = '💾 Force Sync EOD Parquet';
                    btn.disabled = false;
                    status.innerHTML = `<span class="text-rose-400">Sync Failed.</span>`;
                });
        }
        // Initialize News Engine
        document.addEventListener('DOMContentLoaded', () => {
            fetchNewsState();
            loadParquetSymbols();
            newsStateInterval = setInterval(fetchNewsState, 5000);
        });
    </script>
    <!-- Watchlist Manager Modal -->
    <div id="watchlist-modal"
        class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center">
        <div
            class="bg-slate-900 border border-slate-700 rounded-xl shadow-2xl w-full max-w-md overflow-hidden flex flex-col max-h-[80vh]">
            <div class="px-6 py-4 border-b border-slate-800 bg-slate-800/50 flex justify-between items-center">
                <h2 class="text-lg font-bold text-white flex items-center gap-2">📋 Watchlist Manager</h2>
                <button onclick="closeWatchlistModal()" class="text-slate-400 hover:text-white transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                        </path>
                    </svg>
                </button>
            </div>

            <div class="p-6 overflow-y-auto flex-1">
                <!-- Search Bar -->
                <div class="mb-4 relative">
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Search to
                        Add</label>
                    <input type="text" id="watchlist-search" onkeyup="onWatchlistSearch()" placeholder="e.g. SAIL, TCS"
                        class="w-full bg-slate-950 text-white text-sm border border-slate-700 rounded px-3 py-2 focus:outline-none focus:border-indigo-500">
                    <div id="watchlist-search-results"
                        class="absolute left-0 right-0 top-full mt-1 bg-slate-800 border border-slate-600 rounded shadow-lg max-h-96 overflow-y-auto z-10">
                    </div>
                </div>
                <!-- Current Items -->
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Active
                        Symbols</label>
                    <ul id="watchlist-items" class="space-y-1"></ul>
                </div>
            </div>

            <div class="px-6 py-4 bg-slate-800/30 border-t border-slate-800 flex justify-end gap-3">
                <button onclick="closeWatchlistModal()"
                    class="px-4 py-2 text-sm font-bold text-slate-300 hover:text-white transition-colors">Cancel</button>
                <button id="btn-save-watchlist" onclick="saveWatchlist()"
                    class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-bold rounded shadow-lg transition-colors">Save
                    Changes</button>
            </div>
        </div>
    </div>
    <!-- Overlays open over the current tab (#inspect/SAIL, #settings) -->
    <div id="overlay-inspect"></div>
    <div id="overlay-settings"></div>
    <nav id="bottom-bar" class="qf-bottom" aria-label="Main"></nav>
    <script type="module" src="/static/shell/main.js"></script>
    <script type="module" src="/static/performance/main.js"></script>
</body>

</html>
