# QuantFlow decision policy v5.2: v5.1 with one exit change. Every other value is v5.1's.
#
#   horizon.run_on.trail_r 1.0 -> 0.5. At the target the FULL quantity runs on, with the stop
#       0.5R behind the best price (was 1R). The user's concern on 2026-10-13 (IDFCFIRSTB gave
#       back from +2.14R). Replay, 132 trades / 9 days / 21 reached target
#       (stop_floor_check.py --target-exits): vs run on 1R, exit at target -14.7k, partial
#       booking 33% / 50% -4.1k / -6.9k, trail 0.25 / 0.33 / 0.5 / 0.75R +4.8 / +8.7 / +2.0 / +3.1k.
#       Small and consistent; 0.5R is the middle of the range. FUTURE_UPDATES 2.7 B.
#   Revert: QUANTFLOW_POLICY=policy_v5_1.yaml.
#
# v5.1's header follows.
#
# QuantFlow decision policy v5.1: v5 with the stop out of the noise. Entries,
# gates and every exit rule are v5's; only the stop and target a trade opens with
# change, in the paper broker, just before sizing.
#
#   horizon.stop_floor (new). The stop that arrives (structure stop, after the
#       AI judge and the risk clamp) is moved out to at least atr15 x ATR15 from
#       the fill -- ATR15 widened by the stock's usual range at this time of day
#       when tod (core.tod_vol, rebuilt nightly) -- and the target to at least
#       target_min_r x the new risk. The size follows the new stop (same 0.5%
#       risk, fewer shares), so costs per trade fall too.
#
#   Evidence (2026-10-09, replays/stop_floor_check.py: the 63 paper trades of
#   09-29..10-08 re-opened through the real PaperBroker with v5's exits, at the
#   same time and price, on the stored 1-minute candles):
#     as traded (median stop 0.79 ATR15)   -55,825   32 stopped, costs 737/trade
#     floor 1.5 + tod, target 1.5R         -11,003   19 stopped, costs 512/trade
#     neighbours 1.25..2.5 + tod           -11.5k .. -23.5k (no cliff)
#     floor 1.0 (too tight still)          -79,766
#   Per trade +0.31 R (37 better, 16 worse, 10 same; bootstrap 95% -0.04..+0.70).
#   Without 10-08 (entries on a hole in the bars): -35.4k -> +6.2k.
#   It cuts losses; it does not make the entries profitable. The tod table was
#   built on 10-08 from the last 20 sessions (mild look-ahead for earlier days).
#   Revert: QUANTFLOW_POLICY=policy_v5.yaml, or set stop_floor: null.
#
# v5's header follows.
#
# QuantFlow decision policy v5: v4 with a reachable target and a memory rule,
# from the first three paper sessions (2026-09-29 .. 10-01). Every other value
# is v4's.
#
#   horizon.reach_target (new). Every 5 minutes, a target more than atr_mult x
#       ATR15 from the price is pulled in to that distance (never pushed out,
#       never inside entry + floor_r R). No target more than 4 ATR15 away was
#       ever hit in three days; at the pulled-in target v4's run on takes over.
#   horizon.memory (new). When the score's support for the trade has stayed
#       below fade_frac of its value at entry for `minutes`, the stop goes to
#       breakeven once min_open_r is open.
#
#   Replayed with the real PaperBroker over all 51 trades (replays/v5_sim.py):
#   v4 +96,007; reach 3 ATR +102,766; memory +101,005; both +107,765. No
#   trade is worse under either rule; 4 trades change (BANKINDIA, MCX, NBCC,
#   NMDC). 2 ATR is a cliff (+72,853, it cuts 09-29's runners): 3 ATR keeps
#   a margin. Revert: QUANTFLOW_POLICY=policy_v4.yaml.
#
# v4's header follows.
#
# QuantFlow decision policy v4: v3 with two exit changes and a journal, from
# the first three paper sessions (2026-09-29 .. 10-01). Entries are v3's;
# every other value is v3's.
#
#   horizon.run_on (new). At the target, do not exit: keep the trade and
#       trail the stop trail_r behind the best price (it starts at the
#       target minus trail_r). On 10-01, 3 of 4 targets went at least 1R
#       further within the hour.
#   horizon.thesis_exit (new). Close when the live score has opposed the
#       position (score x side <= -against) for `minutes` in a row: "what it
#       thought then vs what it thinks now". IDEA (+1.36R, then the stop)
#       and INFY (137 minutes going nowhere) are the cases it catches.
#   horizon.review_every_min (new). Each open position writes a REVIEW event
#       to the paper log at this cadence and at every decision point (run on,
#       trail step, score turning against it or back): the journal.
#
#   Replayed on the exchange's 1-minute candles over all three days (51
#   trades, entries unchanged): exits as v3 +18,571; run on 1R +66,994;
#   thesis 0.15/10 +46,336; both +94,759, never worse on any day.
#   Parameters were picked on those days: judge v4 on new sessions only.
#   Revert: set QUANTFLOW_POLICY=policy_v3.yaml (or edit core/policy_config.py).
#
# v3's header follows.
#
# QuantFlow decision policy v3: v2 with one change, from the first two paper
# sessions (2026-09-29, 2026-09-30). Every other value is v2's.
#
#   horizon.entry_start_ist "09:45" (new). No new trade in the opening range.
#       Replayed against the exchange's 1-minute candles over both days
#       (32 trades), the 14 opened 09:15-09:45 lost -34,049 with 2 winners;
#       the rest made +62,633. A 09:45 start turns the two days from +12,819
#       to +63,553 and improves each day on its own (+3,878 and +46,856).
#       09:30 (+49,035) and 10:00 (+49,746) were both worse than 09:45.
#       Two sessions only: keep watching the opening-range line in Review.
#
# v2's header follows.
#
# QuantFlow decision policy v2: v1 with four changes, from the evidence of
# the first live paper session (2026-09-29). Every other value is v1's.
#
#   horizon.square_off_ist  15:20 -> 15:10. F&O stocks stop continuous
#       trading at 15:15 (closing auction): on 2026-09-29 23 of the 27 names
#       stopped ticking at 15:15, the 4 non-F&O ones did not, and 6 of 7
#       square-offs closed on a price 5 minutes old.
#   horizon.entry_cutoff_ist  13:45 -> 13:40, so a trade still gets its
#       full 90-minute primary horizon before the earlier square-off.
#   horizon.trail (new). Replayed tick by tick over that day's 18 trades,
#       breakeven at 1.5R then +1R locked at 2.5R turned MCX's -1,515
#       (up 2.6R, closed -0.3R) into +4,645 and cut no winner short; a
#       breakeven at 1R stopped out two winners. One day: watch it in Review.
#   horizon.reversal_cooldown_min (new). SCI and ADANIENT were each stopped
#       out one way and taken the other way ~28 minutes later; both stopped
#       again (-6,662). A same-way re-entry 50 minutes after a stop
#       (OLAELEC, +18,441) is untouched.
#
# v1's header follows.
#
# QuantFlow decision policy v1.
#
# Every threshold here is transcribed from the constant already live in code
# (source line noted per entry, verified by direct read before transcription)
# -- this is a refactor extracting hardcoded values into one auditable,
# versioned place, NOT a retune. Any future change of a value belongs in a
# new policy_v2.yaml after replay evidence justifies it (see Phase 4).
#
# One entry is a documented exception: whale_slope_gate_adv_frac is a NEW,
# ADV-normalised value that does not yet correspond to any code path -- it
# replaces the unnormalised `abs(whale_cvd_slope) > 50` magic number at
# semantic_tagger.py:67, but that call site is not wired to read from this
# config yet (out of scope for Task 2.1, which only builds the loader).
# Wiring it is a documented future step, not a silent behaviour change.

version: 5.2

semantic:
  vol_z_shock: 2.5              # semantic_tagger.py:82
  vol_z_elevated: 1.0           # semantic_tagger.py:84
  vol_z_suppressed: -1.0        # semantic_tagger.py:86
  obi_extreme: 0.60             # semantic_tagger.py:92,96
  obi_moderate: 0.20            # semantic_tagger.py:94,98
  vwap_band_elevated: 0.75      # semantic_tagger.py:57,61
  vwap_band_extreme: 1.50       # semantic_tagger.py:55,59
  whale_slope_gate_adv_frac: 0.002   # NOT YET WIRED -- see header note
  flow_vwap_gate_atr_frac: 0.4  # semantic_tagger.py:67
  iv_pct_extreme: 90            # semantic_tagger.py:120
  iv_pct_elevated: 75           # semantic_tagger.py:122
  iv_pct_compressed: 25         # semantic_tagger.py:124
  gravity_imminent_atr: 0.3     # semantic_tagger.py:135
  gravity_escape_atr: 2.0       # semantic_tagger.py:137
  pcr_pct_high: 80              # semantic_tagger.py:146
  pcr_pct_low: 20               # semantic_tagger.py:148
  proximity_test_atr: 0.5       # semantic_tagger.py:188
  proximity_approach_atr: 1.0   # semantic_tagger.py:190
  alpha_strong: 2.0             # semantic_tagger.py:194
  alpha_moderate: 0.5           # semantic_tagger.py:196

regime:
  memory_len: 12                # regime_manager.py:9
  hysteresis_agreement: 2       # regime_manager.py (2 of last 3)
  hysteresis_window: 3

conviction:
  bias_threshold: 0.15          # conviction_scorer.py:151,153,163,164
  micro_divisor: 5.0            # conviction_scorer.py:95
  deriv_divisor: 3.0            # conviction_scorer.py:110
  struct_divisor: 3.0           # conviction_scorer.py:136
  volume_shock_multiplier: 1.5  # conviction_scorer.py:93
  whipsaw_flip_limit: 3         # conviction_scorer.py:159
  whipsaw_penalty: 0.5          # conviction_scorer.py:160
  min_reward_atr15: 1.5         # conviction_scorer.py:237
  min_reward_risk: 1.5          # Task 4.2 -- the admission gate while UNCALIBRATED
                                # (no measured probability => no statistical edge)
  entry_offset_atr5: 0.2        # conviction_scorer.py:241,256
  slippage_atr5: 0.1            # conviction_scorer.py:262,263
  atr_mult_by_iv_regime:        # conviction_scorer.py:223-226
    EXTREME_EXPANSION: 1.00
    ELEVATED_VOLATILITY: 0.75
    PREMIUM_COMPRESSION: 0.30
    DEFAULT: 0.50
  weights:                      # conviction_scorer.py:8-13
    TREND_EXPANSION:         {micro: 0.45, struct: 0.15, deriv: 0.15, cat: 0.25}
    VOLATILITY_EXPANSION:    {micro: 0.50, struct: 0.30, deriv: 0.10, cat: 0.10}
    RANGE_BOUND_CHOP:        {micro: 0.20, struct: 0.30, deriv: 0.40, cat: 0.10}
    PRE_BREAKOUT_SQUEEZE:    {micro: 0.30, struct: 0.40, deriv: 0.20, cat: 0.10}
    MEAN_REVERSION_IMMINENT: {micro: 0.40, struct: 0.20, deriv: 0.30, cat: 0.10}
    DEFAULT:                 {micro: 0.40, struct: 0.25, deriv: 0.20, cat: 0.15}

gates:
  min_stat_edge: 0.05           # conviction_scorer.py:274; intraday_gatekeeper.py:182
  stop_proximity_pct: 0.5       # intraday_gatekeeper.py:92
  failure_to_launch_min: 45     # intraday_gatekeeper.py
  stagnation_min: 60            # intraday_gatekeeper.py -- aligned to 2/3 of the 90m primary (Task 3.4)
  stagnation_drift_pct: 0.2     # intraday_gatekeeper.py
  whale_flip_adv_frac: 0.03     # intraday_gatekeeper.py:112 (Task 0.9)
  regime_dampening:             # intraday_gatekeeper.py:173-179
    LUNCH_CHOP_HIGH_VOL: 0.85
    LUNCH_CHOP_NORMAL: 0.65
    RANGE_BOUND_CHOP: 0.6
    TRANSITIONAL_DRIFT: 0.7

horizon:                        # Task 3.4 makes these authoritative
  primary_minutes: 90
  entry_start_ist: "09:45"         # v3: no new trade in the opening range
  entry_cutoff_ist: "13:40"        # v2: 90 min before the 15:10 square-off
  square_off_ist: "15:10"          # v2: F&O continuous trading ends 15:15
  trail: [[1.5, 0.0], [2.5, 1.0]]  # v2: [best R reached, stop moved to entry + this R]
  reversal_cooldown_min: 60        # v2: no entry the other way within 60 min of a losing close
  run_on: {trail_r: 0.5}           # v5.2 (was 1.0): at the target keep going, stop trail_r behind the best price
  thesis_exit: {against: 0.15, minutes: 10}   # v4: close when score x side <= -0.15 for 10 min
  review_every_min: 5              # v4: journal a REVIEW of each open position this often
  reach_target: {atr_mult: 3.0, floor_r: 1.0, every_min: 5}   # v5: pull an out-of-reach target in
  memory: {fade_frac: 0.5, minutes: 10, min_open_r: 0.5}      # v5: score faded since entry -> breakeven
  stop_floor: {atr15: 1.5, tod: true, target_min_r: 1.5}      # v5.1: stop >= 1.5 x ATR15 x time-of-day, target >= 1.5R
  measure_at_minutes: [30, 90]
